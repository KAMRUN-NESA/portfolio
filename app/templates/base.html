<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Kamrun Nesa | AI/ML Researcher | GNN | Agentic AI{% endblock %}</title>

    {% include "partials/seo_meta.html" %}

    <!-- Google Fonts - Inter & Fira Code -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Preloader -->
    <div id="preloader" class="preloader" aria-hidden="true">
        <div class="preloader-inner">
            <div class="preloader-ring"></div>
            <span class="preloader-text">KN</span>
        </div>
    </div>

    <!-- Skip to Content -->
    <a href="#main-content" class="skip-link">Skip to content</a>

    {% include "partials/nav.html" %}

    <main id="main-content">
        {% block content %}{% endblock %}
    </main>

    {% include "partials/footer.html" %}

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
