<!-- SECTION 09: Projects -->
<section id="projects">
    <div class="container">
        <div class="section-header reveal">
            <span class="section-label">Portfolio</span>
            <h2 class="section-title">Selected <span class="gradient-text">Works</span></h2>
            <div class="section-divider"></div>
        </div>

        <div class="cards-grid">
            {% for project in data.projects %}
            <div class="card reveal delay-{{ loop.index % 4 }}">
                <div class="card-header">
                    <i class="card-icon fas fa-laptop-code"></i>
                    <div class="card-links">
                        <a href="{{ project.github }}" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
                    </div>
                </div>
                <div class="card-body">
                    <h3 class="card-title">{{ project.name }}</h3>
                    <p class="card-description">{{ project.description }}</p>
                </div>
                <div class="card-footer">
                    <div class="tech-stack">
                        {% for tech in project.tech %}
                        <span class="tech-tag">{{ tech }}</span>
                        {% endfor %}
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</section>
