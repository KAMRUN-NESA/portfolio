<!-- SECTION 02: About Me -->
<section id="about" class="section-alt">
    <div class="container">
        <div class="section-header reveal">
            <span class="section-label">Introduction</span>
            <h2 class="section-title">About <span class="gradient-text">Me</span></h2>
            <div class="section-divider"></div>
        </div>

        <div class="about-content reveal delay-1">
            <div class="about-text">
                {% for paragraph in data.about.paragraphs %}
                <p>{{ paragraph }}</p>
                {% endfor %}
                
                <div class="research-statement-box">
                    <p><i class="fas fa-lightbulb" style="color: var(--primary-color);"></i> {{ data.about.statement }}</p>
                </div>
                
                <div class="about-interests">
                    <span class="interest-tag"><i class="fas fa-project-diagram"></i> Graph Neural Networks</span>
                    <span class="interest-tag"><i class="fas fa-brain"></i> Deep Learning</span>
                    <span class="interest-tag"><i class="fas fa-eye"></i> Computer Vision</span>
                    <span class="interest-tag"><i class="fas fa-robot"></i> Agentic AI</span>
                    <span class="interest-tag"><i class="fas fa-laptop-code"></i> Software Systems</span>
                </div>
            </div>
        </div>
    </div>
</section>
