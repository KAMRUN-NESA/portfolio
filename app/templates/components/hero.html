<!-- SECTION 01: Hero -->
<section id="hero" class="hero">
    <canvas id="hero-canvas" class="hero-canvas"></canvas>
    <div class="container">
        <div class="hero-content">
            <div class="hero-text reveal">
                <p class="hero-greeting">Hello, I'm</p>
                <h1 class="hero-name">{{ data.identity.name }}</h1>
                <h2 class="hero-role">
                    <span id="typing-text"></span><span class="typing-cursor">|</span>
                </h2>
                
                <div class="hero-opportunities">
                    <span class="badge-opportunity"><i class="fas fa-bullseye"></i> {{ data.identity.opportunities_banner }}</span>
                </div>
                
                <p class="hero-tagline">
                    {{ data.identity.description }}
                </p>

                <div class="hero-tags">
                    {% for tag in data.identity.tags %}
                    <span class="hero-tag"><i class="fas fa-check-circle"></i> {{ tag }}</span>
                    {% endfor %}
                </div>

                <div class="hero-buttons">
                    <button class="btn btn-primary" onclick="openCvViewer()">
                        <i class="fas fa-file-alt"></i> View Resume
                    </button>
                    <a href="#research" class="btn btn-secondary">
                        <i class="fas fa-microscope"></i> Explore Research
                    </a>
                    <a href="#publications" class="btn btn-secondary">
                        <i class="fas fa-book-open"></i> View Publications
                    </a>
                    <a href="#contact" class="btn btn-secondary">
                        <i class="fas fa-envelope"></i> Contact Me
                    </a>
                </div>

                <div class="hero-social">
                    <a href="{{ data.identity.social.github }}" target="_blank" title="GitHub"><i class="fab fa-github"></i></a>
                    <a href="{{ data.identity.social.linkedin }}" target="_blank" title="LinkedIn"><i class="fab fa-linkedin"></i></a>
                    <a href="{{ data.identity.social.researchgate }}" target="_blank" title="ResearchGate"><i class="fab fa-researchgate"></i></a>
                    <a href="{{ data.identity.social.orcid }}" target="_blank" title="ORCID"><i class="fab fa-orcid"></i></a>
                </div>
            </div>

            <div class="hero-visual reveal delay-1">
                <!-- Research Flow Visualization Container -->
                <div id="research-flow-viz"></div>
            </div>
        </div>
    </div>
</section>
