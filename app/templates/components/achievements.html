<!-- SECTION 08: Achievements -->
<section id="achievements" class="section-alt">
    <div class="container">
        <div class="section-header reveal">
            <span class="section-label">Honors</span>
            <h2 class="section-title">Achievements & <span class="gradient-text">Activities</span></h2>
            <div class="section-divider"></div>
        </div>

        <div class="cards-grid">
            <div class="card reveal delay-1">
                <div class="card-body" style="padding-top: 1.5rem;">
                    <h3 class="card-title" style="margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;"><i class="fas fa-trophy" style="color: gold;"></i> Recognition</h3>
                    <ul class="timeline-details" style="margin-bottom: 0;">
                        {% for achievement in data.achievements %}
                        <li>{{ achievement }}</li>
                        {% endfor %}
                    </ul>
                </div>
            </div>
        </div>
    </div>
</section>
